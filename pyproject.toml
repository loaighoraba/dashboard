[project]
name = "dashboard"
version = "0.1.0"
description = "A web application to serve my technical needs"
readme = "README.md"
authors = [
    { name = "Loai Ghoraba", email = "loai.ghoraba@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.13.1",
    "pydantic-settings>=2.15.0",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
